name: Test

on:
  pull_request:
    branches: [main]
    paths:
      - "charts/**"
      - "ci/**"
  push:
    branches: [main]
    paths:
      - "charts/**"
      - "ci/**"

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v4.1.4

      - name: Install helm-unittest
        run: helm plugin install https://github.com/helm-unittest/helm-unittest --verify=false

      - name: Run unit tests
        run: |
          if find charts/common -name '*_test.yaml' | grep -q .; then
            helm unittest charts/common
          else
            echo "No unit test files found, skipping helm unittest"
          fi

  template-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Helm
        uses: azure/setup-helm@dda3372f752e03dde6b3237bc9431cdc2f7a02a2 # v5
        with:
          version: v4.1.4

      - name: Build dependencies
        run: helm dependency build ci/common/

      - name: Template with defaults
        run: helm template test ci/common/

      - name: Template with overrides
        run: helm template test ci/common/ --set fullnameOverride=override-test --set global.imageRegistry=test.io

      - name: Template with storage class
        run: helm template test ci/common/ --set global.storageClass=fast-ssd
